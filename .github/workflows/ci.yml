name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Tests & Linter
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the Git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java toolchain
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"
      - name: Add gradlew permission
        run: chmod +x gradlew
      - name: Run Tests & Checkstyle
        run: ./gradlew clean test jacocoTestReport checkstyleMain checkstyleTest
      - name: SonarCloud Scan
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: ./gradlew sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-deploy:
    name: Build and Deploy
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')

    steps:
      - name: Set environment variables
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "APP_PORT=5000" >> $GITHUB_ENV
            echo "CONTAINER_NAME=order_server_prod" >> $GITHUB_ENV
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
            echo "DB_CONTAINER_NAME=order_db_prod" >> $GITHUB_ENV
            echo "DB_NAME=orderdb_prod" >> $GITHUB_ENV
            echo "DB_PORT=5001" >> $GITHUB_ENV
            echo "DB_VOLUME=order_data_prod" >> $GITHUB_ENV
          else
            # STAGING CONFIG
            echo "APP_PORT=5002" >> $GITHUB_ENV
            echo "CONTAINER_NAME=order_server_staging" >> $GITHUB_ENV
            echo "IMAGE_TAG=staging" >> $GITHUB_ENV
            echo "DB_CONTAINER_NAME=order_db_staging" >> $GITHUB_ENV
            echo "DB_NAME=orderdb_staging" >> $GITHUB_ENV
            echo "DB_PORT=5003" >> $GITHUB_ENV
            echo "DB_VOLUME=order_data_staging" >> $GITHUB_ENV
          fi

      - name: Check out code
        uses: actions/checkout@v4
        
      - name: Set up Java toolchain
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Build JAR with Gradle
        run: chmod +x gradlew && ./gradlew bootJar -x test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_HUB_REPO_NAME }}:${{ env.IMAGE_TAG }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_HUB_REPO_NAME }}:${{ env.IMAGE_TAG }}
            docker stop ${{ env.CONTAINER_NAME }} || true
            docker rm ${{ env.CONTAINER_NAME }} || true
            docker network create app_network || true
            
            if [ ! "$(docker ps -aq -f name=^${{ env.DB_CONTAINER_NAME }}$)" ]; then
                docker run -d --name=${{ env.DB_CONTAINER_NAME }} --network=app_network -p ${{ env.DB_PORT }}:5432 -v ${{ env.DB_VOLUME }}:/var/lib/postgresql/data -e POSTGRES_DB=${{ env.DB_NAME }} -e POSTGRES_USER=${{ secrets.POSTGRES_USER }} -e POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} --restart always postgres:15-alpine
            else
                docker start ${{ env.DB_CONTAINER_NAME }}
            fi
            
            docker run -d --name=${{ env.CONTAINER_NAME }} --network=app_network -p ${{ env.APP_PORT }}:8080 -e SPRING_DATASOURCE_URL=jdbc:postgresql://${{ env.DB_CONTAINER_NAME }}:5432/${{ env.DB_NAME }} -e SPRING_DATASOURCE_USERNAME=${{ secrets.POSTGRES_USER }} -e SPRING_DATASOURCE_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} -e JWT_SECRET=${{ secrets.JWT_SECRET }} -e JWT_EXPIRATION=${{ secrets.JWT_EXPIRATION }} -e ORDER_INVENTORY_URL=${{ secrets.INVENTORY_SERVICE_URL }} -e ORDER_INVENTORY_INTERNAL_AUTHORIZATION="${{ secrets.ORDER_INVENTORY_INTERNAL_AUTHORIZATION }}" -e ORDER_WALLET_GRPC_HOST=${{ secrets.WALLET_GRPC_HOST }} -e ORDER_WALLET_GRPC_PORT=${{ secrets.WALLET_GRPC_PORT }} -e GRPC_SERVER_INTERNAL_TOKEN=${{ secrets.GRPC_SERVER_INTERNAL_TOKEN }} -e ORDER_VOUCHER_URL=${{ secrets.VOUCHER_SERVICE_URL }} -e ORDER_PROFILE_URL=${{ secrets.PROFILE_SERVICE_URL }} -e ORDER_PROFILE_INTERNAL_AUTHORIZATION="${{ secrets.ORDER_PROFILE_INTERNAL_AUTHORIZATION }}" --restart always ${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_HUB_REPO_NAME }}:${{ env.IMAGE_TAG }}
