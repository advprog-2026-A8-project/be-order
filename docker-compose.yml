services:
  postgres-main:
    image: postgres:15-alpine
    container_name: order-postgres-main
    profiles: ["main"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orderdb}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5001:5432"
    volumes:
      - order_pgdata_main:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-orderdb}"]
      interval: 5s
      timeout: 5s
      retries: 20

  order-app-main:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order-app-main
    profiles: ["main"]
    depends_on:
      postgres-main:
        condition: service_healthy
    environment:
      ORDER_APP_PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_HOST: postgres-main
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-orderdb}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ORDER_INVENTORY_URL: ${ORDER_INVENTORY_URL:-http://host.docker.internal:4002/api/products}
      ORDER_WALLET_URL: ${ORDER_WALLET_URL:-http://host.docker.internal:6002/api/contracts/wallet}
      ORDER_WALLET_INTERNAL_AUTHORIZATION: ${ORDER_WALLET_INTERNAL_AUTHORIZATION:-Bearer internal-order-service}
      ORDER_VOUCHER_URL: ${ORDER_VOUCHER_URL:-http://host.docker.internal:7002/api/vouchers}
      ORDER_PROFILE_URL: ${ORDER_PROFILE_URL:-http://host.docker.internal:3002/api/profile}
      ORDER_PROFILE_INTERNAL_AUTHORIZATION: ${ORDER_PROFILE_INTERNAL_AUTHORIZATION:-Bearer internal-order-service}
    ports:
      - "5000:8080"

  postgres-dev:
    image: postgres:15-alpine
    container_name: order-postgres-dev
    profiles: ["dev"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB_DEV:-orderdb_dev}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5003:5432"
    volumes:
      - order_pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_DEV:-orderdb_dev}"]
      interval: 5s
      timeout: 5s
      retries: 20

  order-app-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order-app-dev
    profiles: ["dev"]
    depends_on:
      postgres-dev:
        condition: service_healthy
    environment:
      ORDER_APP_PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_HOST: postgres-dev
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB_DEV:-orderdb_dev}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ORDER_INVENTORY_URL: ${ORDER_INVENTORY_URL:-http://host.docker.internal:4002/api/products}
      ORDER_WALLET_URL: ${ORDER_WALLET_URL:-http://host.docker.internal:6002/api/contracts/wallet}
      ORDER_WALLET_INTERNAL_AUTHORIZATION: ${ORDER_WALLET_INTERNAL_AUTHORIZATION:-Bearer internal-order-service}
      ORDER_VOUCHER_URL: ${ORDER_VOUCHER_URL:-http://host.docker.internal:7002/api/vouchers}
      ORDER_PROFILE_URL: ${ORDER_PROFILE_URL:-http://host.docker.internal:3002/api/profile}
      ORDER_PROFILE_INTERNAL_AUTHORIZATION: ${ORDER_PROFILE_INTERNAL_AUTHORIZATION:-Bearer internal-order-service}
    ports:
      - "5002:8080"

volumes:
  order_pgdata_main:
  order_pgdata_dev:
