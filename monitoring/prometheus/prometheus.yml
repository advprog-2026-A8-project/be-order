global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "order-app-main"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:5000"]

  - job_name: "order-app-dev"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:5002"]
