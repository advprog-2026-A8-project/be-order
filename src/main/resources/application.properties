spring.application.name=be-order
server.port=${ORDER_APP_PORT:5002}

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
jwt.secret=${JWT_SECRET:dev-order-jwt-secret-dev-order-jwt-secret-123456}

order.inventory.url=${ORDER_INVENTORY_URL:http://localhost:4002/api/products}
order.inventory.internal-authorization=${ORDER_INVENTORY_INTERNAL_AUTHORIZATION:}
order.wallet.grpc.host=${ORDER_WALLET_GRPC_HOST:localhost}
order.wallet.grpc.port=${ORDER_WALLET_GRPC_PORT:9090}
order.wallet.grpc.internal-token=${GRPC_SERVER_INTERNAL_TOKEN:}
order.voucher.url=${ORDER_VOUCHER_URL:http://localhost:7002/api/vouchers}
order.profile.url=${ORDER_PROFILE_URL:http://localhost:3002/api/profile}
order.profile.internal-authorization=${ORDER_PROFILE_INTERNAL_AUTHORIZATION:}
order.security.principal-claim=${ORDER_SECURITY_PRINCIPAL_CLAIM:sub}
order.checkout.lock.mode=${ORDER_CHECKOUT_LOCK_MODE:postgres-advisory}
order.http.retry.max-attempts=2
order.http.timeout.connect-ms=2000
order.http.timeout.read-ms=4000
order.rating-sync.worker-delay-ms=${ORDER_RATING_SYNC_WORKER_DELAY_MS:3000}
order.rating-sync.batch-size=${ORDER_RATING_SYNC_BATCH_SIZE:20}
order.rating-sync.retry.max-attempts=${ORDER_RATING_SYNC_RETRY_MAX_ATTEMPTS:8}
order.rating-sync.retry.base-delay-ms=${ORDER_RATING_SYNC_RETRY_BASE_DELAY_MS:1000}
order.compensation.worker-delay-ms=${ORDER_COMPENSATION_WORKER_DELAY_MS:3000}
order.compensation.batch-size=${ORDER_COMPENSATION_BATCH_SIZE:20}
order.compensation.retry.max-attempts=${ORDER_COMPENSATION_RETRY_MAX_ATTEMPTS:8}
order.compensation.retry.base-delay-ms=${ORDER_COMPENSATION_RETRY_BASE_DELAY_MS:1000}

management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
management.endpoint.prometheus.access=${MANAGEMENT_ENDPOINT_PROMETHEUS_ACCESS:none}
management.prometheus.metrics.export.enabled=${MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED:false}
